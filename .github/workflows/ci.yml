name: CI

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    uses: bitcart/bitcart-actions/.github/workflows/lint.yml@master
    with:
      install-dependencies: |
        uv sync --frozen --compile-bytecode

  workflows:
    name: workflows
    uses: bitcart/bitcart-actions/.github/workflows/workflow-checks.yml@master

    permissions:
      contents: read
      security-events: write # needed for github advanced security

  test:
    name: test
    uses: bitcart/bitcart-actions/.github/workflows/python-tests.yml@master
    needs: [lint, workflows]
    with:
      python-versions: '["3.12", "3.13", "3.14", "3.15"]'
      install-daemon: true
      daemon-repository: bitcart/bitcart
      daemon-dir: ../daemon
      install-dependencies: |
        uv sync --frozen --compile-bytecode
        cd $DAEMON_DIR
        UV_PROJECT_ENVIRONMENT=$GITHUB_WORKSPACE/.venv uv sync --frozen --compile-bytecode --inexact --no-dev --group btc
      background: cd $DAEMON_DIR && just testnet

    permissions:
      contents: read
      id-token: write # OIDC token for codecov uploads

  functional-tests:
    name: functional-tests
    uses: bitcart/bitcart-actions/.github/workflows/python-tests.yml@master
    needs: test
    with:
      install-daemon: true
      daemon-repository: bitcart/bitcart
      daemon-dir: ../daemon
      install-dependencies: |
        uv sync --frozen --compile-bytecode
        cd $DAEMON_DIR
        UV_PROJECT_ENVIRONMENT=$GITHUB_WORKSPACE/.venv uv sync --frozen --compile-bytecode --inexact --no-dev --group btc
      regtest: true
      tests: just test-functional
      coverage-name: Functional Tests
      coverage-flag: functional-tests

    permissions:
      contents: read
      id-token: write # OIDC token for codecov uploads

  combine-coverage:
    name: combine-coverage
    uses: bitcart/bitcart-actions/.github/workflows/combine-coverage.yml@master
    needs: [test, functional-tests]
    if: ${{ !cancelled() }}
